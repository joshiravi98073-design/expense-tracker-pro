<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer card shape -->
  <g filter="url(#shadow)" transform="translate(64, 96)">
    <rect width="384" height="256" rx="36" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    <!-- Chip -->
    <rect x="40" y="44" width="64" height="48" rx="10" fill="#fde047" opacity="0.9" />
    <line x1="40" y1="68" x2="104" y2="68" stroke="#ca8a04" stroke-width="2" />
    <line x1="72" y1="44" x2="72" y2="92" stroke="#ca8a04" stroke-width="2" />
    <!-- Trend arrow upward -->
    <path d="M190 190 L260 130 L300 160 L360 85" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="360,70 375,100 340,95" fill="#ffffff" />
    <!-- Currency / Pulse dot -->
    <circle cx="340" cy="200" r="14" fill="#34d399" />
    <circle cx="340" cy="200" r="24" fill="#34d399" opacity="0.3" />
  </g>
  <!-- Subtitle Text / Accent -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" letter-spacing="4">EXPENSE PRO</text>
</svg>
